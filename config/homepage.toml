# ────────────────────────────────────────────────────────────────────
#  Home — главный конфиг
#  формат «TOML-like»: [system], [header], [group:Имя], [service:Имя]
# ────────────────────────────────────────────────────────────────────

[system]
title = "Home"
icon_path = "icons"        # папка с иконками, пути в service.icon считаются от неё
config_path = "conf.d"     # все *.toml из этой папки подтягиваются автоматически
mobile_cols = 1

# ─── шапка ─────────────────────────────────────────────────────────
# Всё, что относится к верхней панели, живёт здесь.
# Любой из этих ключей можно написать и в [system] — он всё равно про шапку.

[header]
show = true              # вся шапка целиком (можно писать header = true)
time = true              # часы
time_format = 12         # 12 — AM/PM, 24 — 24-часовой формат
search = true            # строка поиска
icon = "home.svg"        # логотип в шапке (путь относительно system.icon_path)
favicon = "favicon.svg" # иконка вкладки (тоже относительно system.icon_path)
link_mode = "auto"       # auto — по подключению, main — всегда link, alt — всегда alt
                         # (старое имя ключа main_alt = "alt" тоже понимается)

# ─── группы ────────────────────────────────────────────────────────
# priority у группы — это номер столбца, в котором она живёт

# color — акцент группы и цвет её иконок по умолчанию.
# Можно именем палитры Dracula (purple, pink, cyan, green, orange, yellow, red, comment),
# hex-ом (#ff79c6) или записью «имя/#hex». Не указан — акцент подбирается по имени
# группы из той же палитры и не меняется между перезапусками.

[group:Group1]
priority = 1
color = green

[group:Group2]
priority = 2
color = "#8be9fd"

# Group3 объединена с Group2: тот же столбец, сразу под ней
[group:Group3]
link = "Group2"

[group:Group4]
priority = 3
color = "red/#ff5555"

[group:Group5]
priority = 1


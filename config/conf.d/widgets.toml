# ─── Виджеты: живое состояние внутри карточки ────────────────────────────
# Секция [widget:имя] описывает источник данных, а сервис подключает её
# строкой widget = "имя". Сервер опрашивает источник по кэшу и отдаёт
# готовые числа на /api/state; клиент раз в [system] poll секунд обновляет
# нарисованное.

[widget:portainer]              # внутреннее имя, на него ссылается service.widget
type = "portainer"              # тип: что и как спрашивать
url = "https://portainer.example.com:9443"
env = 1                         # номер окружения (endpoint) в Portainer
key = "${PORTAINER_KEY}"        # секрет берётся из окружения, а не из репозитория

# Второй пример: тот же тип, другое окружение.
# [widget:portainer-test]
# type = "portainer"
# url = "https://192.168.0.112:9000"
# env = 1
# key = "${PORTAINER_TEST_KEY}"
# verify_tls = true              # по умолчанию самоподписанный сертификат принимается

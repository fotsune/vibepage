# ─── Виджеты: живое состояние внутри карточки ────────────────────────────
# Секция [widget:имя] описывает источник данных, а сервис подключает её
# строкой widget = "имя". Сервер опрашивает источник по кэшу и отдаёт
# готовые числа на /api/state; клиент раз в [system] poll секунд обновляет
# нарисованное.
#
# Ключ fields задаёт, какие поля показывать и в каком порядке — строкой:
#   fields = "enabled, disabled, total"   → включено, выключено, всего
#   fields = "total, disabled, enabled"   → всего, выключено, включено
# Старая запись списком (fields = ["enabled", "disabled", "total"]) понимается
# точно так же. Без fields поля идут в порядке типа; в карточку влезает
# не больше четырёх — лишние отбрасываются с начала списка.
#
# На карточке может быть несколько виджетов: widget = "имя, другое имя" —
# каждый следующий рисуется под предыдущим.

[group:Widgets]
priority = 5
color = cyan
cols = 2

# ─── Portainer: счётчики контейнеров ─────────────────────────────

[service:Portainer]
link = "https://192.168.0.112:9000"
icon = "sdi:portainer"
desc = "Контейнеры и стеки"
group = "Widgets"
widget = "portainer"
ping = "192.168.0.112:9000"

[widget:portainer]
type = "portainer"
url = "https://192.168.0.112:9000"
env = 1                         # номер окружения (endpoint) в Portainer
key = "${PORTAINER_KEY}"        # секрет берётся из config/.env, а не из репозитория
fields = "running, stopped, total"

# ─── AdGuard Home: DNS и блокировка рекламы ──────────────────────

[service:AdGuard]
link = "http://192.168.0.112:59991"
icon = "sdi:adguard"
desc = "DNS и блокировка рекламы"
group = "Widgets"
widget = "adguard"
ping = "192.168.0.112:59991"

[widget:adguard]
type = "adguard"
url = "http://192.168.0.112:59991"
username = "${ADGUARD_USERNAME}"       # секреты — в config/.env, не в git
password = "${ADGUARD_PASSWORD}"
fields = "queries, blocked, filtered"

# ─── Nginx Proxy Manager: прокси-хосты ───────────────────────────

[service:NPM]
link = "http://192.168.0.112:59990"
icon = "sdi:nginxproxymanager"
desc = "Прокси и сертификаты"
group = "Widgets"
widget = "npm"
ping = "192.168.0.112:59990"

[widget:npm]
type = "npm"
url = "http://192.168.0.112:59990"
username = "${NPM_USERNAME}"
password = "${NPM_PASSWORD}"
fields = "enabled, disabled, total"

# ─── Minecraft: жив ли сервер ───────────────────────────────────

[service:Minecraft]
link = "udp://192.168.0.11:25565"
icon = "sdi:minecraft"
desc = "Новый мир"
group = "Widgets"
widget = "minecraft"
ping = "192.168.0.11:25565"

[widget:minecraft]
type = "minecraft"
url = "udp://192.168.0.11:25565"     # host:port или udp://host:port
fields = "players, version, status"

# ─── changedetection.io: наблюдения за страницами ────────────────

[service:Changedetection]
link = "http://192.168.0.112:59992"
icon = "sdi:changedetection"
desc = "Наблюдения за страницами"
group = "Widgets"
widget = "changedetection"
ping = "192.168.0.112:59992"

[widget:changedetection]
type = "changedetectionio"
url = "http://192.168.0.112:59992"
key = "${CHANGEDETECTION_KEY}"   # API-ключ из настроек changedetection.io
fields = "diffsDetected, totalObserved"

# ─── Uptime Kuma: страница статуса ───────────────────────────────

[service:UptimeKuma]
link = "http://192.168.0.112:59994/status/statuspageslug"
icon = "sdi:uptimekuma"
desc = "Страница статуса"
group = "Widgets"
widget = "uptimekuma"
ping = "192.168.0.112:59994"

[widget:uptimekuma]
type = "uptimekuma"
url = "http://192.168.0.112:59994"
slug = "statuspageslug"
fields = "up, down, uptime, incident"

# ─── Your Spotify: что слушал ───────────────────────────────────

[service:YourSpotify]
link = "https://spoti-api.example.com"
icon = "sdi:spotify"
desc = "Статистика прослушиваний"
group = "Widgets"
widget = "yourspotify"

[widget:yourspotify]
type = "yourspotify"
url = "${YOURSPOTIFY_URL}"
key = "${YOURSPOTIFY_KEY}"
interval = "month"             # day, week (по умолчанию), month, year или all
fields = "songs, time, artists"

# ─── Watchtower: последнее обновление контейнеров ────────────────

[service:Watchtower]
link = "http://192.168.0.112:59993"
icon = "sdi:watchtower"
desc = "Автообновление контейнеров"
group = "Widgets"
widget = "watchtower"
ping = "192.168.0.112:59993"

[widget:watchtower]
type = "watchtower"
url = "http://192.168.0.112:59993"
key = "${WATCHTOWER_KEY}"        # WATCHTOWER_HTTP_API_TOKEN
fields = "containers_scanned, containers_updated, containers_failed"

# ─── qBittorrent: раздачи ─────────────────────────────────

[service:Qbittorrent]
link = "http://192.168.0.112:59995"
icon = "sdi:qbittorrent"
desc = "Раздачи и скорости"
group = "Widgets"
widget = "qbittorrent"
ping = "192.168.0.112:59995"      # порт — значит TCP: жив ли сам сервис

[widget:qbittorrent]
type = qbittorrent
url = "http://192.168.0.112:59995"
username = "${QBT_USERNAME}"        # секреты — в config/.env, не в git
password = "${QBT_PASSWORD}"
key = "${QBT_KEY:-}"                # ключ API главнее логина; пусто — вход по паролю
enableleechprogress = true          # под полями — очередь качающегося
enableleechsize = true              # и сколько осталось у каждой строки
fields = "leech, download, seed, upload"

# ─── Navidrome: медиатека ──────────────────────────────────

[service:Navidrome]
link = "http://192.168.0.112:59996"
icon = "sdi:navidrome"
desc = "Медиатека и что играет"
group = "Widgets"
widget = "navidrome"
ping = "192.168.0.112:59996"

[widget:navidrome]
type = navidrome
url = "http://192.168.0.112:59996/api"   # база Subsonic-API: у этого сервера baseURL = /api
user = "${NAVIDROME_USER}"
token = "${NAVIDROME_TOKEN}"          # md5(пароль + salt): пароль по сети не ходит
salt = "${NAVIDROME_SALT}"
fields = "playing, artists, albums"

# ─── Хост: этот же сервер, где живёт dashboard ────────────────────
# Без link и alt карточка никуда не ведёт: она просто показывает
# состояние, кликнуть по ней нельзя и курсор не меняется.
# Три виджета на одной карточке: cpu, ram, disk — сверху вниз.

[service:ThisHost]
icon = "mdi:server"
desc = "Этот хост"
group = "Widgets"
widget = "cpu, ram, disk"     # каждый следующий — под предыдущим

[widget:cpu]
type = cpu
fields = "cpu, cputemp, uptime"
tempmin = 20            # шкала для температуры: ниже — зелёная, выше tempmax — красная
tempmax = 90
units = metric          # imperial переведёт температуру в °F (по умолчанию metric)

[widget:ram]
type = ram
fields = "free, consumed, total"
ramunits = bytes        # bytes — 1.5 GB (1000), bbytes — 1.4 GiB (1024)

[widget:disk]
type = disk
name = "C:, D:"        # подпись на карточке: одна строка мельче подписей полей
disk = "C:\, D:\"      # пути как есть; на linux — /, /mnt/data
diskunits = bytes       # bytes — 1.5 GB (1000), bbytes — 1.4 GiB (1024)
fields = "free, consumed, total"


[service:OtherHost]
icon = "mdi:server"
desc = "Другой хост"
group = "Widgets"
widget = "cpu_ext, ram_ext, disk_ext"     # каждый следующий — под предыдущим
ping = "192.168.0.113"                   # без порта — ICMP: жив ли хост, а не сервис

[widget:cpu_ext]
type = cpu
external = "cpu"
host = http://192.168.0.113:24556
fields = "cpu, cputemp, uptime"
tempmin = 20            # шкала для температуры: ниже — зелёная, выше tempmax — красная
tempmax = 90
units = metric          # imperial переведёт температуру в °F (по умолчанию metric)

[widget:ram_ext]
type = ram
external = "ram"
host = http://192.168.0.113:24556
fields = "free, consumed, total"
ramunits = bytes        # bytes — 1.5 GB (1000), bbytes — 1.4 GiB (1024)

[widget:disk_ext]
type = disk
external = "disk"
host = http://192.168.0.113:24556
name = "/"
diskunits = bbytes
fields = "free, consumed, total"

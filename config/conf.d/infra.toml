# ─── Group3: сервисы (объединена с Group2) ───────────────────────

[service:Vaultwarden]
link = "https://vault.example.com"
icon = "mdi:key-chain"
desc = "Пароли и токены"
group = "Group3"

# icon умеет три вида:
#   icon = "code.svg"          файл из system.icon_path (svg красится в цвет иконки)
#   icon = "mdi:account-box"   набор Iconify: mdi, sdi (Simple Icons) или любой другой
#   icon_link = "https://…"    внешняя картинка (icon имеет приоритет)
# icon_color задаёт цвет иконки; без него берётся акцент группы.

[service:Gitea]
link = "https://git.example.com"
icon = "sdi:gitea"
icon_color = purple
desc = "Свой git-сервер"
group = "Group3"

[service:Paperless-ngx]
link = "https://paperless.example.com"
icon = "book.svg"
desc = "Архив документов"
group = "Group3"

# ─── Group4: инфраструктура ──────────────────────────────────────

[service:Proxmox]
link = "https://proxmox.example.com:8006"
icon = "sdi:proxmox"
desc = "Виртуалки и LXC"
group = "Group4"

[service:Pi-hole]
link = "http://192.168.1.10/admin"
icon = "shield.svg"
desc = "DNS и блокировка рекламы"
group = "Group4"

[service:qBittorrent]
link = "http://192.168.1.10:8080"
icon = "mdi:download"
icon_color = orange
desc = "Торренты"
group = "Group4"

[service:Syncthing]
link = "http://192.168.1.10:8384"
icon = "sync.svg"
desc = "Синхронизация папок"
group = "Group4"

# иконка может быть внешней ссылкой: icon_link (icon имеет приоритет)
[service:RomM]
link = "http://192.168.1.10:8088"
icon_link = "https://cdn.simpleicons.org/retroarch/BD93F9"
desc = "Ретро-игры в браузере"
group = "Group4"

# ─── Group5: хранилище ───────────────────────────────────────────

[service:MinIO]
link = "https://minio.example.com"
icon = "database.svg"
desc = "S3-хранилище"
group = "Group5"

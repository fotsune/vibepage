# Часть настроек может лежать в отдельном файле: секции [system]
# из всех конфигов склеиваются, приоритет у главного конфига.

[system]
cols = 3                    # столбцов с группами на десктопе (1..)
open_in_new_page = True
state_interval = 10         # как часто страница спрашивает /api/state, секунд (мин. 3)
group_cols = 3              # максимум столбцов карточек в группе (0 — сколько влезет)
